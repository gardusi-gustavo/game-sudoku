name: backup
on:
  push:
    branches: [main]
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  backup:
    uses: gardusi-gustavo/devops/.github/workflows/backup.yml@main
    with:
      repository: gardusi-gustavo/game-sudoku
      retention: 3
    secrets: inherit
