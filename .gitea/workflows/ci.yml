name: ci
on:
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check game
        run: docker run --rm --volumes-from "$(hostname)" -w "$PWD" rust:1.85 cargo check --all-targets
      - name: Check solver
        run: python3 -m unittest discover -s bots/solver -p 'test_*.py'
