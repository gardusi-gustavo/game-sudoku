name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check game
        run: cargo check --all-targets
      - name: Check solver
        run: python3 -m unittest discover -s bots/solver -p 'test_*.py'
